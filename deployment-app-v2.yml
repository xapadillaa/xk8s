apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-app-v2
  labels:
    app: sample.app.v2 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample.app.v2
  template:
    metadata:
      labels:
        app: sample.app.v2
    spec:
      containers:
      - name: sample-app-v2
        image: xapadillaa/nginx-sample:2.0
        ports:
        - containerPort: 80


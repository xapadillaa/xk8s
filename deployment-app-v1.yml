apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-app-v1
  labels:
    app: sample.app.v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample.app.v1
  template:
    metadata:
      labels:
        app: sample.app.v1
    spec:
      containers:
      - name: sample-app-v1
        image: xapadillaa/nginx-sample:1.0
        ports:
        - containerPort: 80

